[package]
name = "uadl"
version = "0.1.0"
edition = "2021"
description = "Download an Unacademy class as a single MP4 with the whiteboard rendered in"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rayon = "1"
base64 = "0.22"
sha1_smol = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
