name: release

# Build uadl for every Linux architecture and attach the tarballs to a
# GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Or run it by hand from the Actions tab (workflow_dispatch) to get the
# tarballs as build artifacts without cutting a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Exotic architectures are best-effort: a C dependency that does not know
    # the target should not sink the whole release. Whatever builds ships.
    continue-on-error: ${{ matrix.best_effort || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- 64-bit x86 ---
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          # --- 64-bit ARM ---
          - target: aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
          # --- 32-bit ARM ---
          - target: armv7-unknown-linux-gnueabihf
          - target: armv7-unknown-linux-musleabihf
          - target: arm-unknown-linux-gnueabihf
          # --- 32-bit x86 ---
          - target: i686-unknown-linux-gnu
          - target: i686-unknown-linux-musl
          # --- everything else ---
          - target: riscv64gc-unknown-linux-gnu
            best_effort: true
          - target: powerpc64le-unknown-linux-gnu
            best_effort: true
          - target: s390x-unknown-linux-gnu
            best_effort: true
          - target: loongarch64-unknown-linux-gnu
            best_effort: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross runs each target's build in a container that already has the
      # right linker and sysroot, so no apt-get juggling here.
      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="uadl-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/uadl" "dist/${name}/"
          cp README.md run.sh "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: publish
    needs: build
    # Even if some best-effort target failed, ship what built.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
